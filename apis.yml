aid: clarapath
name: Clarapath
description: 'Clarapath is a medical robotics company headquartered in Hawthorne, New
  York that automates the tissue sectioning step of the clinical histopathology workflow.
  Its FDA-registered SectionStar platform pairs patented tape-transfer sectioning with
  precision robotics, integrated optics and sensors, and computational quality control
  to turn paraffin blocks into standardized slides with quantitative quality metrics.
  The company also ships the TrimStar Pro trimming system, a HistoStation data repository
  for sample and image traceability, remote Telehistology operation, and histology
  consulting services for hospital, reference, and veterinary laboratories.'
